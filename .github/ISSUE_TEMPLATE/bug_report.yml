name: Bug report
description: Report a reproducible diagnosis or repair problem without private artifacts
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach rollout JSONL, SQLite databases, backups, prompts, credentials, private paths, or full logs.
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: codex-cli 0.x.y
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux distribution and architecture
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operation
      options:
        - Diagnose
        - Apply
        - Post-resume verification
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Sanitized result
      description: Include status, blocker names, cursor ordinals, record types, and aggregate counts only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all raw transcripts, databases, credentials, private paths, and real thread IDs.
          required: true
